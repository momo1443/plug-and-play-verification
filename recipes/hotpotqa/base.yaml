- name: hotpotqa_agent
  _target_: recipes.hotpotqa.hotpotqa_agent_flow.HotpotQAAgentFlow
  # Three research turns plus one reserved final-answer turn.
  max_steps: 4
  max_parallel_calls: 1
  # Formal A0/A1/A2/A3: every retrieval must be attributable to a model action.
  # Optional compatibility override: HOTPOTQA_FORCE_FIRST_SEARCH=true.
  force_first_search: false

  # BGE checkpoint. Must match `env/build_index.py --embedding_model`.
  embedding_model_name: ${oc.env:HOTPOTQA_EMBEDDING_MODEL,BAAI/bge-large-en-v1.5}
  # Retrieval corpus/index root. This is separate from train/validation parquet data.
  corpus_data_dir: ${oc.env:HOTPOTQA_CORPUS_DATA_ROOT,data/corpus/hotpotqa_corpus}
  # Exact official source sentences/supporting facts aligned to the frozen PID order.
  evidence_sidecar_path: ${oc.env:HOTPOTQA_EVIDENCE_SIDECAR,data/corpus/hotpotqa_corpus/hotpotqa_evidence_v1.sqlite3}
  require_sentence_evidence: ${oc.env:HOTPOTQA_REQUIRE_SENTENCE_EVIDENCE,false}
  # null: use HOTPOTQA_EMBEDDING_DEVICE (default cpu), or per-worker cuda:i
  # if HOTPOTQA_EMBEDDING_PER_WORKER_GPU=1.
  embedding_devices: null
  enable_tool_parse_feedback: true
